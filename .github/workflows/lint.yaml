name: Lint Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/lint.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - name: Lint and render charts
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            set -- "${chart}"
            if [ -f "${chart}ci/test-values.yaml" ]; then
              set -- "$@" -f "${chart}ci/test-values.yaml"
            fi
            echo "==> Linting ${chart}"
            helm lint "$@"
            echo "==> Templating ${chart}"
            helm template test "$@"
          done
