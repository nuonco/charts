name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/release.yaml"

permissions:
  packages: write
  contents: write

env:
  REGISTRY: ghcr.io
  REPO_OWNER: nuonco

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - ctl-api
          - dashboard-ui
          - telemetry-relay
          - telemetry-agent
          - runner
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push ${{ matrix.chart }}
        id: package
        run: |
          set -euo pipefail
          chart_dir="charts/${{ matrix.chart }}"
          chart_name=${{ matrix.chart }}
          chart_version=$(grep '^version:' "${chart_dir}/Chart.yaml" | awk '{print $2}')
          helm package "${chart_dir}"
          helm push "${chart_name}-${chart_version}.tgz" "oci://${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/charts"
          echo "version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "tgz=${chart_name}-${chart_version}.tgz" >> "$GITHUB_OUTPUT"

      # Publishes the packaged chart as a GitHub release asset so it can be
      # consumed by URL, e.g. from the terraform helm provider:
      #   chart = "https://github.com/nuonco/charts/releases/download/<chart>-v<version>/<chart>-<version>.tgz"
      # Reuses the tag if it already exists, so previously tagged versions get
      # backfilled with a release.
      - name: Publish GitHub release for ${{ matrix.chart }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_name="${{ matrix.chart }}-v${{ steps.package.outputs.version }}"
          if gh release view "${tag_name}" >/dev/null 2>&1; then
            echo "release ${tag_name} already exists; skipping"
            exit 0
          fi
          gh release create "${tag_name}" "${{ steps.package.outputs.tgz }}" \
            --target "${{ github.sha }}" \
            --title "${tag_name}" \
            --notes "Helm chart ${{ matrix.chart }} ${{ steps.package.outputs.version }}" \
            --latest=false
