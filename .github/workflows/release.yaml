name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  REPO_OWNER: nuonco

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.changed.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed charts
        id: changed
        run: |
          charts=()
          for chart in charts/*/; do
            name=$(basename "$chart")
            if git diff --name-only HEAD~1 HEAD -- "$chart" | grep -q .; then
              charts+=("\"${name}\"")
            fi
          done
          if [ ${#charts[@]} -eq 0 ]; then
            echo "charts=[]" >> "$GITHUB_OUTPUT"
          else
            echo "charts=[$(IFS=,; echo "${charts[*]}")]" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push ${{ matrix.chart }}
        run: |
          chart_dir="charts/${{ matrix.chart }}"
          helm package "${chart_dir}"
          chart_version=$(grep '^version:' "${chart_dir}/Chart.yaml" | awk '{print $2}')
          chart_name=${{ matrix.chart }}
          helm push "${chart_name}-${chart_version}.tgz" "oci://${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/charts"
