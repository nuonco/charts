auth:
  enabled: true
api:
  public:
    neg:
      enabled: true
  runner:
    neg:
      enabled: true
  auth:
    neg:
      enabled: true
  mcp:
    enabled: true
    neg:
      enabled: true
  slack:
    enabled: true
    neg:
      enabled: true
      name: custom-slack-neg
environment: test
image:
  repository: example.com/ctl-api
  tag: v1.2.3
env:
  VERSION: from-env
hooks:
  enabled: true
  commands:
    - args: [startup]
      phase: pre
    - args: [admin, runners, update]
      onVersionChange: true
    - args: [admin, post-promotion]
      onVersionChange: true
      activeDeadlineSeconds: 120
      backoffLimit: 2
