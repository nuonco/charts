# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Deployment environment name (e.g. `production`, `staging`)
environment: ""

image:
  # -- Container image repository
  repository: ""
  # -- Container image tag
  tag: ""

serviceAccount:
  # -- Whether to create and use a service account
  enabled: true
  # -- Service account name
  name: ""
  # -- Annotations to add to the service account
  annotations: {}

# -- Environment variables set via the ConfigMap (key/value pairs)
env: {}

# -- Secrets to inject as environment variables
# @default -- `[]`
# Example:
# ```yaml
# envSecrets:
#   - name: SECRET_KEY
#     valueFrom:
#       name: my-secret
#       key: secret-key
# ```
envSecrets: []

# -- GCP-specific configuration. When enabled, GCP Gateway/HTTPRoute/HealthCheckPolicy resources are created instead of AWS ALBs.
# @default -- disabled
gcp:
  # -- Enable GCP ingress resources (Gateway API). Requires the Gateway API and `networking.gke.io` CRDs to be installed on the cluster.
  enabled: false
  # -- GCP certificate map name for the gateway
  certMap: ""

auth:
  # -- Enable the auth API endpoint
  enabled: false
  # -- Secrets specific to the auth API
  envSecrets: []

api:
  # -- Liveness probe configuration for API deployments
  liveness_probe: {}
  # -- Readiness probe configuration for API deployments
  readiness_probe: {}
  # -- Node selector for API pods
  nodeSelector: {}
  # -- Tolerations for API pods
  tolerations: []
  # -- Topology spread constraints for API pods (applied to admin, auth, public, runner, startup)
  topologySpreadConstraints: []
  # -- Default resources for every api deployment. Each api.<service> (public,
  # admin, runner, auth, dashboard_admin, slack) can override this block —
  # individual fields deep-merge over these defaults. `limits` is optional and
  # can be omitted globally or per service.
  resources:
    requests:
      # -- CPU request for API containers
      cpu: "100m"
      # -- Memory request for API containers
      memory: "128Mi"
  admin:
    # -- Admin API domain
    domain: ""
    # -- Admin API container port
    port: 8080
    autoscaling:
      # -- Minimum replicas for admin API
      minReplicas: 1
      # -- Maximum replicas for admin API
      maxReplicas: 3
      # -- Target CPU utilization for admin API autoscaling
      targetCPUUtilizationPercentage: 80
      # -- Target memory utilization for admin API autoscaling
      targetMemoryUtilizationPercentage: 80
  auth:
    # -- Auth API domain
    domain: ""
    # -- Auth API TLS certificate ARN (AWS) or name (GCP)
    domain_certificate: ""
    # -- Auth API container port
    port: 8080
    autoscaling:
      # -- Minimum replicas for auth API
      minReplicas: 1
      # -- Maximum replicas for auth API
      maxReplicas: 3
      # -- Target CPU utilization for auth API autoscaling
      targetCPUUtilizationPercentage: 80
      # -- Target memory utilization for auth API autoscaling
      targetMemoryUtilizationPercentage: 80
  dashboard_admin:
    # -- Run the dashboard-admin workload (Deployment + ClusterIP Service + HPA).
    # The Service is always cluster-internal, so the dashboard-ui chart can proxy
    # to it regardless of whether the ALB below is enabled.
    enabled: false
    # -- Dashboard admin container port
    port: 8085
    # -- Expose dashboard-admin via a dedicated internet-facing ALB. Set
    # `enabled: false` to keep it reachable only inside the cluster (e.g. proxied
    # by the dashboard-ui service).
    alb:
      # -- Whether to create the internet-facing ALB ingress
      enabled: false
      # -- Public domain for the ALB (external-dns hostname)
      domain: ""
      # -- TLS certificate ARN (AWS) or name (GCP) for the ALB
      domain_certificate: ""
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 75
  slack:
    # -- Enable the Slack integration listener (deployment, service, ALB)
    enabled: false
    # -- Slack listener domain (e.g. slack.<root_domain>)
    domain: ""
    # -- Slack listener TLS certificate ARN (AWS) or name (GCP)
    domain_certificate: ""
    # -- Slack listener container port
    port: 8089
  public:
    # -- Public API domain
    domain: ""
    # -- Public API TLS certificate ARN (AWS) or name (GCP)
    domain_certificate: ""
    # -- Public API container port
    port: 8080
    autoscaling:
      # -- Minimum replicas for public API
      minReplicas: 1
      # -- Maximum replicas for public API
      maxReplicas: 3
      # -- Target CPU utilization for public API autoscaling
      targetCPUUtilizationPercentage: 80
      # -- Target memory utilization for public API autoscaling
      targetMemoryUtilizationPercentage: 80
  runner:
    # -- Runner API domain
    domain: ""
    # -- Runner API TLS certificate ARN (AWS) or name (GCP)
    domain_certificate: ""
    # -- Runner API container port
    port: 8080
    autoscaling:
      # -- Minimum replicas for runner API
      minReplicas: 1
      # -- Maximum replicas for runner API
      maxReplicas: 3
      # -- Target CPU utilization for runner API autoscaling
      targetCPUUtilizationPercentage: 80
      # -- Target memory utilization for runner API autoscaling
      targetMemoryUtilizationPercentage: 80

worker:
  # -- Default resource requests/limits for all workers (can be overridden per instance)
  resources: {}
  # -- Node selector for worker pods
  nodeSelector: {}
  # -- Tolerations for worker pods
  tolerations: []
  # -- Topology spread constraints for worker pods
  topologySpreadConstraints: []
  autoscaling:
    # -- Target CPU utilization for worker autoscaling
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization for worker autoscaling
    targetMemoryUtilizationPercentage: 80
  # -- Worker instance definitions. Each entry creates a separate Deployment.
  # @default -- `[]`
  # Example:
  # ```yaml
  # instances:
  #   - namespace: my-temporal-ns
  #     command: ["./worker", "--namespace", "my-temporal-ns"]
  #     resources:
  #       requests:
  #         cpu: "200m"
  #         memory: "256Mi"
  # ```
  instances: []
