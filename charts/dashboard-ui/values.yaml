# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Deployment environment name (e.g. `production`, `staging`)
environment: ""

image:
  # -- Container image repository
  repository: ""
  # -- Container image tag
  tag: ""

serviceAccount:
  # -- Whether to create and use a service account
  enabled: true
  # -- Service account name
  name: ""
  # -- Annotations to add to the service account
  annotations: {}

# -- Environment variables set via the ConfigMap (key/value pairs)
env: {}

# -- Secrets to inject as environment variables
# @default -- `[]`
envSecrets: []

# `gcp.gateways` lists the Gateways to attach to, one HTTPRoute each. The `external-gateway` route is named
# `<fullname>`; any other is `<fullname>-<gateway name>` and annotated `external-dns.alpha.kubernetes.io/controller: none`
# so its (internal) address never reaches public DNS. Each entry takes `name`, `namespace`
# (default `ctl-api`) and `sectionName` (default `https`). If unset it defaults to
# `[{name: external-gateway, namespace: ctl-api, sectionName: https}]`. An empty list renders no HTTPRoute.
#
# gcp:
#   enabled: true
#   gateways:
#     - name: external-gateway
#     - name: psc-gateway

ingress:
  # -- Render ingress resources: the AWS ALB Ingress, or the GCP HTTPRoute and backend policies when `gcp.enabled`. Set to `false` when the load balancer is managed outside the cluster and reaches the pods through the standalone NEG (`neg.enabled`).
  enabled: true

# -- GCP-specific configuration. When `gcp.enabled`, GCP ingress resources are created instead of AWS ALBs. See `gcp.gateways` above.
# @default -- disabled
gcp:
  # -- Create GCP ingress resources (HTTPRoute, HealthCheckPolicy, GCPBackendPolicy) instead of the AWS ALB Ingress. Requires the Gateway API and `networking.gke.io` CRDs.
  enabled: false
  # -- Cloud Armor security policy name attached via GCPBackendPolicy (omit to skip Cloud Armor; the GCPBackendPolicy is always created for `logging`)
  securityPolicy: ""
  # -- Backend service access logging, set on each backend's GCPBackendPolicy
  logging:
    # -- Enable LB access logging for the backends
    enabled: true
    # -- Fraction of requests logged, in millionths (`1000000` logs every request)
    sampleRate: 1000000

neg:
  # -- Create `<fullname>-neg`, a second ClusterIP Service annotated `cloud.google.com/neg` so GKE creates a standalone zonal NEG for a load balancer managed outside the cluster. The regular Service is unchanged. Health checks use the serving port (`ui.port`) and `ui.readiness_probe`.
  enabled: false
  # -- NEG name. Defaults to the regular Service name (`<fullname>`).
  name: ""

ui:
  # -- UI container port
  port: 4000
  # -- Liveness probe path
  liveness_probe: /livez
  # -- Readiness probe path
  readiness_probe: /readyz
  # -- Container security context for the UI container
  securityContext: {}
  # -- Node selector for UI pods
  nodeSelector: {}
  # -- Tolerations for UI pods
  tolerations: []
  resources:
    requests:
      # -- CPU request for UI containers
      cpu: "500m"
      # -- Memory request for UI containers
      memory: "512Mi"
    limits:
      # -- CPU limit for UI containers
      cpu: "1000m"
      # -- Memory limit for UI containers
      memory: "1024Mi"
  alb:
    # -- Public domain for the ALB
    public_domain: ""
    # -- TLS certificate ARN (AWS) for the ALB
    public_domain_certificate: ""
  autoscaling:
    # -- Minimum replicas
    minReplicas: 2
    # -- Maximum replicas
    maxReplicas: 5
    # -- Target CPU utilization for autoscaling
    targetCPUUtilizationPercentage: 50
    # -- Target memory utilization for autoscaling
    targetMemoryUtilizationPercentage: 50
