{{- if include "telemetry-agent.createBootstrapSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telemetry-agent.bootstrapSecretName" . }}
  labels:
    {{- include "telemetry-agent.selectorLabels" . | nindent 4 }}
type: Opaque
data:
  token: {{ toString .Values.bootstrapToken | b64enc | quote }}
{{- end }}
