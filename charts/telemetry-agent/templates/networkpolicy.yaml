{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "telemetry-agent.fullname" . }}
  labels:
    {{- include "telemetry-agent.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "telemetry-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
