{{- if .Values.aws.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "telemetry-relay.fullname" . }}
  labels:
    {{- include "telemetry-relay.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn is required when aws.enabled" .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: "13133"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "5"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=60
    {{- if .Values.ingress.groupName }}
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName | quote }}
    {{- end }}
    external-dns.alpha.kubernetes.io/hostname: {{ required "ingress.domain is required when aws.enabled" .Values.ingress.domain | trimSuffix "." | quote }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.ingress.domain | trimSuffix "." | quote }}
      http:
        paths:
          {{- range list "/v1/logs" "/v1/metrics" "/v1/traces" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "telemetry-relay.fullname" $ }}
                port:
                  name: otlp-http
          {{- end }}
{{- end }}
