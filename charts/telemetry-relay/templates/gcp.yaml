{{- if .Values.gcp.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "telemetry-relay.fullname" . }}
  labels:
    {{- include "telemetry-relay.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ required "gateway.hostname is required" .Values.gateway.hostname | trimSuffix "." | quote }}
  rules:
    {{- range list "/v1/logs" "/v1/metrics" "/v1/traces" }}
    - matches:
        - path:
            type: Exact
            value: {{ . }}
      backendRefs:
        - name: {{ include "telemetry-relay.fullname" $ }}
          port: 4318
    {{- end }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "telemetry-relay.fullname" . }}
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 2
    healthyThreshold: 2
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /
        port: 13133
  targetRef:
    group: ""
    kind: Service
    name: {{ include "telemetry-relay.fullname" . }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "telemetry-relay.fullname" . }}
spec:
  default:
    timeoutSec: 40
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ""
    kind: Service
    name: {{ include "telemetry-relay.fullname" . }}
{{- end }}
