fullnameOverride: telemetry-relay

replicaCount: 2

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

env:
  NUON_TELEMETRY_ISSUER: ""
  NUON_TELEMETRY_JWKS_URL: ""
  # Defaults to the AWS/GCP public ingress URL; set explicitly for custom ingress.
  NUON_TELEMETRY_AUDIENCE: ""
  NUON_TELEMETRY_ALLOW_LEGACY_AUDIENCE: "true"
  NUON_TELEMETRY_ALLOWED_ORG_IDS: "[]"

envSecrets: []

environmentReceiver:
  enabled: false

gcp:
  enabled: false

aws:
  enabled: false

gateway:
  name: external-gateway
  namespace: ctl-api
  hostname: ""

ingress:
  domain: ""
  certificateArn: ""
  groupName: ""

resources:
  requests:
    cpu: 250m
    memory: 640Mi
  limits:
    memory: 768Mi

nodeSelector: {}
tolerations: []
affinity: {}
