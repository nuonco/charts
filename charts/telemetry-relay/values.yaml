fullnameOverride: telemetry-relay

replicaCount: 2

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

env:
  NUON_TELEMETRY_ISSUER: ""
  NUON_TELEMETRY_JWKS_URL: ""
  # Defaults to the AWS/GCP public ingress URL; set explicitly for custom ingress.
  NUON_TELEMETRY_AUDIENCE: ""
  NUON_TELEMETRY_ALLOW_LEGACY_AUDIENCE: "true"
  NUON_TELEMETRY_ALLOWED_ORG_IDS: "[]"

envSecrets: []

environmentReceiver:
  enabled: false

gcp:
  enabled: false
  # -- Cloud Armor security policy name attached to the existing GCPBackendPolicy (omit to skip)
  securityPolicy: ""

aws:
  enabled: false

neg:
  # -- Create `<fullname>-neg`, a second ClusterIP Service annotated `cloud.google.com/neg` so GKE creates a
  # standalone zonal NEG on port 4318 for a load balancer managed outside the cluster. The regular Service is
  # unchanged. Health checks must use `/` on port 13133, not the OTLP port.
  enabled: false
  # -- NEG name. Defaults to the regular Service name (`<fullname>`).
  name: ""

gateway:
  name: external-gateway
  namespace: ctl-api
  hostname: ""

ingress:
  domain: ""
  certificateArn: ""
  groupName: ""

resources:
  requests:
    cpu: 250m
    memory: 640Mi
  limits:
    memory: 768Mi

nodeSelector: {}
tolerations: []
affinity: {}
